<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Mago y el Balrog</title>
<meta name="description" content="Animación en pixel art: un mago de barba blanca se enfrenta a un demonio de fuego sobre un puente de piedra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a10;
    --panel: #15131c;
    --border: #2c2636;
    --fg: #ece8f4;
    --muted: #a39cb2;
    --fire: #ff8a2a;
    --magic: #9fd4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(255, 90, 20, .18), transparent 60%),
      var(--bg);
  }
  main { max-width: 1024px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(14px, 3.4vw, 26px);
    line-height: 1.5;
    margin: 0 0 6px;
    color: var(--fire);
    text-shadow: 3px 3px 0 #3a0e08;
  }
  h1 span { color: var(--magic); text-shadow: 3px 3px 0 #10223d; }
  p.sub { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .stage {
    position: relative;
    border: 4px solid var(--border);
    background: #000;
    box-shadow: 0 0 0 4px #000, 0 20px 60px rgba(0,0,0,.6), 0 0 80px rgba(255,100,30,.12);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  .bar { height: 4px; background: #1d1926; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--magic), var(--fire)); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  button {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    padding: 11px 14px;
    color: var(--fg);
    background: var(--panel);
    border: 2px solid var(--border);
    box-shadow: 3px 3px 0 #000;
    cursor: pointer;
  }
  button:hover { border-color: var(--fire); }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  button[aria-pressed="true"] { border-color: var(--magic); color: var(--magic); }
  footer { margin-top: 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  footer kbd {
    font-family: "Press Start 2P", monospace; font-size: 9px;
    padding: 2px 5px; border: 1px solid var(--border); background: var(--panel);
  }
</style>
</head>
<body>
<main>
  <h1><span>El Mago</span> y el Balrog</h1>
  <p class="sub">Un duelo en pixel art sobre el puente roto. Hecho solo con Canvas y JavaScript.</p>

  <div class="stage">
    <canvas id="scene" width="320" height="180" aria-label="Animación: un demonio de fuego surge del abismo, pelea con un mago y lo arrastra con su látigo"></canvas>
    <div class="bar"><div id="progress"></div></div>
  </div>

  <div class="controls">
    <button id="btnPause" aria-pressed="false">Pausa</button>
    <button id="btnRestart">Reiniciar</button>
    <button id="btnSlow" aria-pressed="false">Lento x0.5</button>
  </div>

  <footer>
    Atajos: <kbd>Espacio</kbd> pausa · <kbd>R</kbd> reinicia · <kbd>S</kbd> cámara lenta.
    La escena se repite en bucle.
  </footer>
</main>

<script>
(() => {
  'use strict';

  // ---------- Configuración básica ----------
  const W = 320, H = 180;
  const FLOOR = 128;          // parte superior del puente
  const BRIDGE_H = 12;
  const BR_END = 296;         // extremo roto del puente (de ahí sube el Balrog)
  const CRACK = 170;          // punto donde se rompe el puente con el golpe final
  const WX = 56, WY = FLOOR - 60; // posición del mago (sprite 16x30 a escala 2)

  // Línea de tiempo (segundos)
  const TL = {
    rise0: .6, rise1: 2.8, land: 3.4, roar1: 4.4,
    cast0: 4.6, orb0: 5.8, orbHit: 6.4,
    lash0: 6.8, lashCrack: 7.5,
    shield0: 7.6, fb0: 8.1, fbHit: 8.9, shield1: 10.0,
    bolt0: 11.2, bolt1: 12.0,
    slam: 13.25, crack: 13.8, brk: 14.1, fall: 14.15,
    whip0: 14.5, grab: 14.9, tipped: 15.2, edge: 15.8, letgo: 17.6,
    fade0: 19.2,
  };
  const LOOP = 20.2;

  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // ---------- Utilidades ----------
  const rr = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
  const easeOut = k => 1 - Math.pow(1 - k, 3);
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const hash = (x, y) => {
    const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return s - Math.floor(s);
  };

  // Línea de píxeles en la rejilla global (tamaño s)
  function line(x0, y0, x1, y1, s, c) {
    ctx.fillStyle = c;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) / s));
    for (let i = 0; i <= n; i++) {
      const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
      ctx.fillRect(Math.round(x / s) * s, Math.round(y / s) * s, s, s);
    }
  }

  // Línea en coordenadas locales de un sprite (unidades de tamaño s)
  function lineU(ox, oy, s, x0, y0, x1, y1, c) {
    ctx.fillStyle = c;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    for (let i = 0; i <= n; i++) {
      const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
      ctx.fillRect(ox + x * s, oy + y * s, s, s);
    }
  }

  function pcircle(cx, cy, r, colorAt) {
    for (let y = -r; y <= r; y++) {
      for (let x = -r; x <= r; x++) {
        const d = Math.hypot(x, y);
        if (d > r) continue;
        ctx.fillStyle = colorAt(d / r);
        ctx.fillRect(Math.round(cx + x), Math.round(cy + y), 1, 1);
      }
    }
  }

  function glow(x, y, r, rgb, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${a})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.restore();
  }

  function paintRows(c, rows, pal, ox, oy, s, override) {
    for (let y = 0; y < rows.length; y++) {
      const r = rows[y];
      for (let x = 0; x < r.length; x++) {
        const ch = r[x];
        if (ch === '.') continue;
        let col = override || pal[ch];
        if (typeof col === 'function') col = col(x, y);
        if (!col) continue;
        c.fillStyle = col;
        c.fillRect(ox + x * s, oy + y * s, s, s);
      }
    }
  }
  const drawSprite = (rows, pal, ox, oy, s, override) => paintRows(ctx, rows, pal, ox, oy, s, override);

  function spriteCanvas(rows, pal, s) {
    const c = document.createElement('canvas');
    c.width = Math.max(...rows.map(r => r.length)) * s;
    c.height = rows.length * s;
    paintRows(c.getContext('2d'), rows, pal, 0, 0, s);
    return c;
  }

  function pointInPoly(x, y, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  function fillPolyU(pts, ox, oy, s, colorAt) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = Math.floor(Math.min(...xs)), x1 = Math.ceil(Math.max(...xs));
    const y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (!pointInPoly(x + .5, y + .5, pts)) continue;
        ctx.fillStyle = colorAt(x, y);
        ctx.fillRect(ox + x * s, oy + y * s, s, s);
      }
    }
  }

  // ---------- Sprites ----------
  // Mago (mirando a la derecha), escala 2
  const WIZ = [
    '........H.......',
    '.......HH.......',
    '.......HHh......',
    '......HHHh......',
    '......HHHHh.....',
    '.....HHHHHh.....',
    '....HHHHHHHh....',
    '..HHHHHHHHHHHHh.',
    '...hhhhhhhhhhh..',
    '....wwSSSSSS....',
    '....wwSSSESSS...',
    '....wwSSSSSSSs..',
    '....wwWWSSSS....',
    '....wWWWWWWW....',
    '...RwWWWWWWWR...',
    '..RRwWWWWWWWRR..',
    '..RRRwWWWWWWRR..',
    '..RRRwWWWWWRRR..',
    '..RRRRwWWWWRRR..',
    '..RRRRRwWWRRRR..',
    '..RBBBBBBBBBBR..',
    '..rRRRRRRRRRRR..',
    '..rRRRRRRRRRRR..',
    '.rrRRRRRRRRRRRR.',
    '.rrRRRRRRRRRRRR.',
    '.rrrRRRRRRRRRRR.',
    'rrrRRRRRRRRRRRRR',
    'rrrrRRRRRRRRRRRR',
    'rrrrrRRRRRRRRRRR',
    '...bbbb...bbbb..',
  ];
  const WPAL = {
    H: '#8d939c', h: '#5e636c', S: '#e6b98f', s: '#b98a64', E: '#1a1418',
    W: '#f4f4f6', w: '#c3c3cc', R: '#a3a9b2', r: '#6f757e', B: '#4b3a28', b: '#3a2c20',
  };
  // Mago sin sombrero (cuando el látigo lo atrapa) y el sombrero suelto
  const WIZ_NOHAT = ['.....wwwww......', '....wwwwwww.....', ...WIZ.slice(9)];
  const wizNoHatCv = spriteCanvas(WIZ_NOHAT, WPAL, 2);   // 32 x 46
  const hatCv = spriteCanvas(WIZ.slice(0, 9), WPAL, 2);  // 32 x 18

  // Balrog (mirando a la izquierda), escala 3
  const BAL = [
    '..O.............O...................',
    '..Oo...........oO...................',
    '...Oo.........oO....................',
    '....OoKKKKKKKoO.....................',
    '....kKKKKKKKKKKk....................',
    '...kKYYKKKKKYYKKk...................',
    '...kKKYYKKKYYKKKk...................',
    '...kKKKKKKKKKKKKKk..................',
    '...kTKTKTKKKKKKKKkk.................',
    '....kLLLLLLKKKKKKKKkk...............',
    '....kTKTKTKKKKKKKKKKKkk.............',
    '.....kkKKKKKKKKKKKKKKKKkk...........',
    '...kkKKKKKKKKKKKKKKKKKKKKkk.........',
    '..kKKKKKMMKKKKKKLKKKKKKKKKKk........',
    '.kKKKKKMMMMKKKKLLKKKKKKKKKKKk.......',
    '.kKKKKMMMMMMKKKKLKKKKKKKKKKKKk......',
    'kKKKKKKMMMMKKKKKKKLKKKKKKKKKKk......',
    'kKKK.kKKMMKKKKKKKKLLKKKKKKKKKk......',
    'kKKK..kKKKKKKLKKKKKKLKKKKKKKKk......',
    'kKK...kKKKKKKLLKKKKKKKKKKKKKk.......',
    'kKK...kKKKKKKKLKKKKKKKKKKKKk........',
    'kKK....kKKKKKKKKKKKKKKKKKKk.........',
    'kKK....kKKKKKLKKKKKKKKKKKk..........',
    'kKKk...kKKKKKLLKKKKKKKKKKk..........',
    '.kKKk...kKKKKKKLKKKKKKKKKk..........',
    '..kLLk..kKKKKKKKKKKKKKKKKk..........',
    '..kLLk...kKKKKKKKKKKKKKKk...........',
    '..kkkk...kKKKKKK..KKKKKKk...........',
    '.........kKKKKK....KKKKKk...........',
    '........kKKKKKk....kKKKKKk..........',
    '........kKKLKKk.....kKKKKk..........',
    '........kKKLKk......kKKLKk..........',
    '.......kKKKKKk......kKKLKKk.........',
    '.......kKKKKk........kKKKKk.........',
    '......kKKKKKk........kKKKKKk........',
    '.....kkKKKKKk........kKKKKKkk.......',
    '....kkkkkkkkk........kkkkkkkkk......',
  ];
  const BAL_H = BAL.length * 3;
  const REST_BY = FLOOR - BAL_H;
  const LAVA = ['#fff1a8', '#ffc23a', '#ff8a1a', '#e0500c', '#a82a08'];
  let T = 0; // tiempo global (para parpadeos)
  const lavaCol = (x, y) => {
    const n = (Math.sin(T * 6 + x * 1.3 + y * .9) + Math.sin(T * 9.7 - x * .7 + y * 1.9)) * .25 + .5;
    return LAVA[Math.min(4, Math.floor((1 - n) * 5))];
  };
  const BPAL = {
    K: '#2b1611', k: '#120806', M: '#44231a', O: '#dccba2', o: '#8f7e5c', T: '#fff4d6',
    Y: () => (Math.sin(T * 5) > -.7 ? '#fff27a' : '#ffb13d'),
    L: lavaCol,
  };

  // ---------- Fondo pre-renderizado ----------
  const bgCv = document.createElement('canvas');
  bgCv.width = W; bgCv.height = H;
  (function paintBackground() {
    const b = bgCv.getContext('2d');
    const img = b.createImageData(W, H);
    const farPillars = [[12, 10], [98, 8], [150, 10], [232, 8], [300, 12]];
    const nearPillars = [[32, 20], [262, 22]];
    const inPillar = (list, x) => list.find(([px, pw]) => x >= px && x < px + pw);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const n = hash(x >> 3, y >> 3) * .6 + hash(x >> 2, y >> 2) * .4;
        let r = 12 + n * 10, g = 9 + n * 7, bl = 16 + n * 11;
        let p;
        if ((p = inPillar(nearPillars, x))) {
          const lx = x - p[0];
          const row = Math.floor(y / 10);
          const mortar = y % 10 === 0 || ((lx + (row % 2) * 7) % 14 === 0);
          const shade = lx < 2 ? 1.35 : lx > p[1] - 3 ? .6 : 1;
          r = 42 * shade; g = 36 * shade; bl = 48 * shade;
          if (mortar) { r *= .55; g *= .55; bl *= .55; }
          r += n * 6; g += n * 5; bl += n * 6;
        } else if ((p = inPillar(farPillars, x))) {
          const lx = x - p[0];
          const shade = lx < 1 ? 1.25 : lx > p[1] - 2 ? .7 : 1;
          r = 26 * shade; g = 22 * shade; bl = 32 * shade;
          if (y % 8 === 0) { r *= .7; g *= .7; bl *= .7; }
        }
        // oscuridad arriba, resplandor de fuego abajo
        const top = clamp(1 - y / 60, 0, 1);
        r *= 1 - top * .5; g *= 1 - top * .5; bl *= 1 - top * .4;
        const glowK = Math.pow(clamp((y - 70) / 110, 0, 1), 2);
        r += 150 * glowK; g += 45 * glowK; bl += 8 * glowK;
        const i = (y * W + x) * 4;
        img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = bl; img.data[i + 3] = 255;
      }
    }
    b.putImageData(img, 0, 0);
  })();

  const vigCv = document.createElement('canvas');
  vigCv.width = W; vigCv.height = H;
  (function paintVignette() {
    const v = vigCv.getContext('2d');
    const g = v.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 200);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.6)');
    v.fillStyle = g;
    v.fillRect(0, 0, W, H);
  })();

  // Puente (con el extremo derecho ya roto)
  const bridgeCv = document.createElement('canvas');
  bridgeCv.width = W; bridgeCv.height = BRIDGE_H;
  (function paintBridge() {
    const b = bridgeCv.getContext('2d');
    for (let y = 0; y < BRIDGE_H; y++) {
      const edge = BR_END - Math.round(hash(y >> 1, 3) * 7) - (y > 7 ? (y - 7) * 2 : 0);
      for (let x = 0; x < W; x++) {
        if (x > edge) continue;
        const n = hash(x >> 1, y >> 1);
        let c = [78 + n * 14, 72 + n * 12, 84 + n * 14];
        if (y === 0) c = [128, 120, 134];
        else if (y === 1) c = [100, 94, 108];
        const row = y < 6 ? 0 : 1;
        if (y === 6 || ((x + row * 9) % 18 === 0 && y > 1 && y < 10)) c = c.map(v => v * .55);
        if (y >= 10) c = c.map(v => v * (y === 10 ? .55 : .35));
        if (x >= edge - 1) c = c.map(v => v * .6);
        b.fillStyle = `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
        b.fillRect(x, y, 1, 1);
      }
    }
  })();

  // ---------- Estado de la escena ----------
  let S;
  function reset() {
    S = {
      p: [], shake: 0, flash: 0, flashRGB: '255,255,255',
      knock: 0, hit: 0, fired: {}, chunks: null, cracked: false,
      fallY: 0, fallV: 0, shieldFlash: 0, bolt: null, boltTimer: 0,
    };
  }
  reset();

  const once = (key, cond, fn) => { if (cond && !S.fired[key]) { S.fired[key] = true; fn(); } };

  const MAX_P = 1600;
  function addP(o) {
    if (S.p.length > MAX_P) return;
    const p = Object.assign({ vx: 0, vy: 0, g: 0, drag: 0, life: 1, size: 2, kind: 'fire' }, o);
    p.max = p.life;
    S.p.push(p);
  }
  function spawn(rate, dt, fn) {
    let n = rate * dt;
    while (n >= 1) { fn(); n--; }
    if (Math.random() < n) fn();
  }
  function burst(n, x, y, kind, speed, extra = {}) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = rr(speed * .3, speed);
      addP(Object.assign({ kind, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rr(.3, .8), drag: 2, size: Math.random() < .5 ? 2 : 1 }, extra));
    }
  }

  // ---------- Poses del mago ----------
  // [mano x, mano y, ángulo del bastón] en unidades del sprite
  const POSE = {
    idle: [13, 19, -90],
    cast: [16, 13, -35],
    guard: [17, 15, -75],
    high: [11, 2, -90],
    slam: [14, 21, -90],
  };
  const TIMELINE = [
    [0, 'idle'], [TL.cast0, 'idle'], [5.2, 'cast'], [6.6, 'cast'], [7.2, 'guard'], [TL.shield1, 'guard'],
    [10.6, 'cast'], [TL.bolt1, 'cast'], [12.6, 'high'], [13.1, 'high'], [TL.slam, 'slam'], [LOOP, 'slam'],
  ];
  function pose(t) {
    for (let i = 0; i < TIMELINE.length - 1; i++) {
      const [t0, a] = TIMELINE[i], [t1, b] = TIMELINE[i + 1];
      if (t >= t0 && t < t1) {
        const k = ease((t - t0) / (t1 - t0));
        return POSE[a].map((v, j) => lerp(v, POSE[b][j], k));
      }
    }
    return POSE.slam;
  }

  function charge(t) {
    if (t >= 5.0 && t < TL.orb0) return seg(t, 5.0, TL.orb0);
    if (t >= TL.orb0 && t < 6.2) return 1 - seg(t, TL.orb0, 6.2);
    if (t >= 10.6 && t < TL.bolt1) return seg(t, 10.6, TL.bolt0);
    if (t >= TL.bolt1 && t < 12.6) return 1 - seg(t, TL.bolt1, 12.4);
    if (t >= 12.6 && t < TL.slam) return seg(t, 12.6, 13.1);
    if (t >= TL.slam && t < TL.grab) return 1 - seg(t, TL.slam, 14.6);
    return 0;
  }

  function geom(t) {
    const [hx, hy, deg] = pose(t);
    const a = deg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
    const hand = { x: WX + hx * 2, y: WY + hy * 2 };
    const tip = { x: hand.x + dx * 28, y: hand.y + dy * 28 };
    const bot = { x: hand.x - dx * 22, y: Math.min(FLOOR, hand.y - dy * 22) };

    // El Balrog sube desde el abismo por el extremo roto y aterriza en el puente
    let bx, by, hover = 0;
    if (t < TL.rise1) {
      bx = 236;
      by = lerp(H + 30, REST_BY - 24, easeOut(seg(t, TL.rise0, TL.rise1)));
      hover = 1;
    } else if (t < TL.land) {
      const k = seg(t, TL.rise1, TL.land);
      bx = lerp(236, 186, ease(k));
      by = lerp(REST_BY - 24, REST_BY, k * k);
      hover = 1 - k;
    } else {
      bx = 186;
      by = REST_BY;
    }
    bx = Math.round(bx + S.knock);
    by = Math.round(by + Math.sin(T * 2) + Math.sin(T * 10) * 2 * hover + S.fallY);
    return {
      hx, hy, a, hand, tip, bot, bx, by, hover,
      chest: { x: bx + 42, y: by + 48 },
      mouth: { x: bx + 15, y: by + 27 },
      whipHand: { x: bx + 10, y: by + 78 },
    };
  }

  // ---------- Estado del mago (de pie, arrastrado, colgando, cayendo) ----------
  const HANG_X = CRACK - 26, HANG_Y = FLOOR + 2;
  function wizState(t) {
    if (t < TL.grab) return { mode: 'stand', feet: { x: WX + 16, y: FLOOR - 2 } };
    if (t < TL.edge) {
      // cae de espaldas (pivote en los pies) y el látigo lo arrastra hacia el borde
      const ang = -Math.PI / 2 * easeOut(seg(t, TL.grab, TL.tipped));
      const px = lerp(WX, CRACK + 8, ease(seg(t, TL.tipped, TL.edge)));
      const fx = 16, fy = -2;
      return {
        mode: 'drag', px, ang,
        feet: { x: px + fx * Math.cos(ang) - fy * Math.sin(ang), y: FLOOR + fx * Math.sin(ang) + fy * Math.cos(ang) },
      };
    }
    const sx = HANG_X + Math.round(Math.sin(T * 2.5) * 1.5);
    let sy = HANG_Y;
    let mode = 'hang';
    if (t >= TL.letgo) {
      const k = t - TL.letgo;
      sy += 30 * k + 150 * k * k;
      mode = 'fall';
    }
    return { mode, sx, sy, feet: { x: sx + 16, y: sy + 44 } };
  }

  // ---------- Látigo de fuego ----------
  const LASH = [[0, 110, 10], [.4, -60, -6], [.7, 185, 2], [1, 110, 10]];
  function whipPoints(t, G, Wz) {
    // Desde que lanza el látigo hacia el mago: curva hacia sus pies
    if (t >= TL.whip0) {
      const A = { x: G.whipHand.x, y: Math.min(G.whipHand.y, H + 30) };
      let B, C;
      if (t < TL.grab) {
        const k = easeOut(seg(t, TL.whip0, TL.grab));
        const start = { x: A.x - 20, y: A.y - 40 };
        B = { x: lerp(start.x, Wz.feet.x, k), y: lerp(start.y, Wz.feet.y, k) };
        C = { x: (A.x + B.x) / 2 + 40 * (1 - k), y: Math.min(A.y, B.y) - 50 * (1 - k) - 6 };
      } else {
        B = Wz.feet;
        C = { x: (A.x + B.x) / 2 + Math.sin(T * 8) * 4, y: (A.y + B.y) / 2 + 8 };
      }
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const s = i / 24;
        pts.push({
          x: (1 - s) * (1 - s) * A.x + 2 * (1 - s) * s * C.x + s * s * B.x,
          y: (1 - s) * (1 - s) * A.y + 2 * (1 - s) * s * C.y + s * s * B.y,
        });
      }
      return pts;
    }

    let a0 = 110, curl = 10;
    const onBridge = t >= TL.land && t < TL.fall;
    if (t < TL.land) { a0 = 95 + Math.sin(T * 3) * 12; curl = 1; }
    if (t >= TL.lash0 && t < TL.lash0 + 1) {
      const u = t - TL.lash0;
      for (let i = 0; i < LASH.length - 1; i++) {
        if (u >= LASH[i][0] && u < LASH[i + 1][0]) {
          const k = ease((u - LASH[i][0]) / (LASH[i + 1][0] - LASH[i][0]));
          a0 = lerp(LASH[i][1], LASH[i + 1][1], k);
          curl = lerp(LASH[i][2], LASH[i + 1][2], k);
        }
      }
    }
    if (t >= TL.fall) { a0 = -80 + Math.sin(T * 9) * 25; curl = Math.sin(T * 6) * 8; }
    const pts = [{ x: G.whipHand.x, y: G.whipHand.y }];
    let x = G.whipHand.x, y = G.whipHand.y;
    for (let i = 0; i < 16; i++) {
      const ang = (a0 + curl * i + Math.sin(T * 3 + i * .6) * i * .8) * Math.PI / 180;
      x += Math.cos(ang) * 5;
      y += Math.sin(ang) * 5;
      if (onBridge && y > FLOOR - 2) y = FLOOR - 2;
      pts.push({ x, y });
    }
    return pts;
  }

  // ---------- Rayo ----------
  function genBolt(a, b) {
    const pts = [a];
    const n = 9, nx = -(b.y - a.y), ny = b.x - a.x, len = Math.hypot(nx, ny) || 1;
    for (let i = 1; i < n; i++) {
      const k = i / n, off = rr(-12, 12) * Math.sin(k * Math.PI);
      pts.push({ x: lerp(a.x, b.x, k) + nx / len * off, y: lerp(a.y, b.y, k) + ny / len * off });
    }
    pts.push(b);
    const bi = 3 + Math.floor(Math.random() * 4);
    const branch = [pts[bi]];
    let bx = pts[bi].x, byy = pts[bi].y;
    for (let i = 0; i < 3; i++) { bx += rr(4, 12); byy += rr(-12, 12); branch.push({ x: bx, y: byy }); }
    return { pts, branch };
  }

  // ---------- Actualización ----------
  function update(t, dt) {
    const G = geom(t);
    const Wz = wizState(t);

    // Brasas que suben del abismo
    spawn(14, dt, () => addP({ kind: 'ember', x: rr(0, W), y: H + 2, vx: rr(-4, 4), vy: rr(-18, -38), life: rr(3, 6), size: 1 }));

    // Fuego del Balrog
    if (G.by < H + 60) {
      spawn(75, dt, () => {
        const head = Math.random() < .45;
        const lx = head ? rr(3, 17) : rr(14, 29), ly = head ? rr(0, 4) : rr(9, 14);
        addP({ kind: 'fire', x: G.bx + lx * 3, y: G.by + ly * 3, vx: rr(-6, 14), vy: rr(-42, -18), life: rr(.4, 1), size: Math.random() < .5 ? 3 : 2 });
      });
    }
    if (G.by < H + 60 || t >= TL.whip0) {
      const wp = whipPoints(t, G, Wz);
      spawn(22, dt, () => {
        const p = wp[1 + Math.floor(Math.random() * (wp.length - 1))];
        if (p.y < H) addP({ kind: 'fire', x: p.x, y: p.y, vx: rr(-5, 5), vy: rr(-25, -10), life: rr(.2, .5), size: 2 });
      });
    }

    // Aterriza en el puente y ruge
    once('land', t >= TL.land, () => {
      S.shake = 7; S.flash = .25; S.flashRGB = '255,120,40';
      for (let i = 0; i < 26; i++) addP({ kind: 'dust', x: G.bx + rr(20, 85), y: FLOOR - 1, vx: rr(-40, 40), vy: rr(-30, -5), g: 50, life: rr(.5, 1), size: 2 });
    });
    if (t >= TL.land && t < TL.roar1) {
      S.shake = Math.max(S.shake, 1.5);
      spawn(90, dt, () => addP({ kind: 'fire', x: G.mouth.x, y: G.mouth.y + rr(-3, 3), vx: rr(-90, -40), vy: rr(-20, 15), life: rr(.3, .6), drag: 1.5, size: 2 }));
    }

    // Energía acumulándose en el bastón
    const ch = charge(t);
    if (ch > .05 && t < TL.slam) {
      spawn(45 * ch, dt, () => {
        const a = Math.random() * Math.PI * 2, r = rr(10, 22);
        addP({ kind: 'magic', x: G.tip.x + Math.cos(a) * r, y: G.tip.y + Math.sin(a) * r, vx: -Math.cos(a) * r * 2.6, vy: -Math.sin(a) * r * 2.6, life: .35, size: 1 });
      });
    }

    // Orbe de luz
    if (t >= TL.orb0 && t < TL.orbHit) {
      const o = orbPos(t, G);
      spawn(90, dt, () => addP({ kind: 'magic', x: o.x + rr(-2, 2), y: o.y + rr(-2, 2), vx: rr(-15, 5), vy: rr(-8, 8), life: rr(.2, .5), size: Math.random() < .5 ? 2 : 1 }));
    }
    once('hit1', t >= TL.orbHit, () => {
      burst(55, G.chest.x, G.chest.y, 'magic', 90);
      burst(20, G.chest.x, G.chest.y, 'spark', 70);
      S.flash = .6; S.flashRGB = '220,240,255'; S.shake = 6; S.hit = .15; S.knock = 14;
    });

    // El Balrog responde: chasquido del látigo...
    once('crackwhip', t >= TL.lashCrack, () => {
      const wp = whipPoints(t, G, Wz), tip = wp[wp.length - 1];
      burst(25, tip.x, tip.y, 'spark', 80);
      S.shake = Math.max(S.shake, 3); S.flash = .2; S.flashRGB = '255,140,40';
    });

    // ...y una bola de fuego contra el escudo
    if (t >= TL.fb0 && t < TL.fbHit) {
      const f = fireballPos(t, G);
      spawn(140, dt, () => addP({ kind: 'fire', x: f.x + rr(-3, 3), y: f.y + rr(-3, 3), vx: rr(5, 30), vy: rr(-20, 5), life: rr(.2, .5), size: 2 }));
    }
    once('fbhit', t >= TL.fbHit, () => {
      const f = fireballPos(TL.fbHit, G);
      burst(70, f.x, f.y, 'fire', 110, { g: -20 });
      burst(25, f.x, f.y, 'magic', 60);
      S.shieldFlash = 1; S.shake = 5; S.flash = .3; S.flashRGB = '255,150,60';
    });

    // Rayo
    if (t >= TL.bolt0 && t < TL.bolt1) {
      S.boltTimer -= dt;
      if (S.boltTimer <= 0) {
        S.bolt = genBolt({ x: G.tip.x, y: G.tip.y }, { x: G.chest.x + rr(-6, 6), y: G.chest.y + rr(-8, 8) });
        S.boltTimer = .05;
        S.flash = Math.max(S.flash, rr(.05, .25)); S.flashRGB = '190,220,255';
      }
      S.hit = .05;
      S.knock = Math.min(18, S.knock + 60 * dt);
      S.shake = Math.max(S.shake, 2);
      spawn(80, dt, () => burst(1, G.chest.x, G.chest.y, 'spark', 90));
    } else {
      S.bolt = null;
    }

    // Golpe final con el bastón: ¡No pasarás!
    once('slam', t >= TL.slam, () => {
      S.shake = 8; S.flash = .8; S.flashRGB = '235,245,255';
      burst(40, G.bot.x, FLOOR, 'magic', 120, { vy: -40 });
      for (let i = 0; i < 24; i++) addP({ kind: 'dust', x: G.bot.x + rr(-14, 14), y: FLOOR - 1, vx: rr(-40, 40), vy: rr(-40, -10), g: 60, life: rr(.5, 1), size: 2 });
      for (let i = 0; i < 40; i++) addP({ kind: 'dust', x: rr(0, W), y: rr(-10, 4), vx: rr(-3, 3), vy: rr(10, 30), g: 50, life: rr(1.5, 2.8), size: 1 });
    });
    if (t >= TL.slam && t < TL.crack) {
      const fx = shockX(t, G);
      spawn(90, dt, () => addP({ kind: Math.random() < .5 ? 'magic' : 'dust', x: fx + rr(-4, 4), y: FLOOR - 1, vx: rr(-20, 20), vy: rr(-50, -10), g: 60, life: rr(.3, .7), size: Math.random() < .5 ? 2 : 1 }));
    }
    once('crack', t >= TL.crack, () => {
      S.cracked = true; S.shake = Math.max(S.shake, 4); S.hit = .12;
      for (let i = 0; i < 14; i++) addP({ kind: 'dust', x: CRACK + rr(-3, 3), y: FLOOR + rr(0, 10), vx: rr(-20, 20), vy: rr(-10, 30), g: 120, life: rr(.6, 1.2), size: 2 });
    });
    once('break', t >= TL.brk, () => {
      S.chunks = [];
      let x = CRACK;
      while (x < BR_END) {
        const w = Math.min(W - x, Math.round(rr(10, 22)));
        S.chunks.push({ x, w, y: 0, vy: 0, dx: 0, vx: rr(-6, 6), delay: (x - CRACK) / W * .25 + rr(0, .08) });
        x += w;
      }
      S.shake = 6; S.hit = .12;
    });

    if (S.chunks) {
      for (const c of S.chunks) {
        if (t - TL.brk < c.delay) continue;
        c.vy += 320 * dt; c.y += c.vy * dt; c.dx += c.vx * dt;
        if (c.y < 30) spawn(30, dt, () => addP({ kind: 'dust', x: c.x + rr(0, c.w), y: FLOOR + c.y + BRIDGE_H, vx: rr(-8, 8), vy: rr(0, 20), g: 40, life: rr(.4, .8), size: 1 }));
      }
    }
    if (t >= TL.fall) {
      S.fallV += 300 * dt;
      S.fallY += S.fallV * dt;
    }

    // El látigo atrapa al mago y lo arrastra
    once('grab', t >= TL.grab, () => {
      burst(30, Wz.feet.x, Wz.feet.y, 'spark', 70);
      S.shake = 5; S.flash = .25; S.flashRGB = '255,140,40';
    });
    if (Wz.mode === 'drag' && t >= TL.tipped) {
      spawn(60, dt, () => addP({ kind: 'dust', x: Wz.px - rr(0, 40), y: FLOOR - 1, vx: rr(-30, 0), vy: rr(-20, -5), g: 50, life: rr(.3, .7), size: 2 }));
    }
    once('hang', t >= TL.edge, () => {
      S.shake = 4;
      for (let i = 0; i < 16; i++) addP({ kind: 'dust', x: CRACK - rr(0, 20), y: FLOOR + rr(0, 4), vx: rr(-10, 10), vy: rr(10, 40), g: 120, life: rr(.6, 1.2), size: 2 });
    });

    // Decaimientos
    S.knock += (0 - S.knock) * Math.min(1, dt * 2.5);
    S.shake = Math.max(0, S.shake - dt * 12);
    S.flash = Math.max(0, S.flash - dt * 2.5);
    S.hit = Math.max(0, S.hit - dt);
    S.shieldFlash = Math.max(0, S.shieldFlash - dt * 2);

    // Partículas
    for (const p of S.p) {
      p.life -= dt;
      const d = Math.max(0, 1 - p.drag * dt);
      p.vx *= d; p.vy *= d;
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    S.p = S.p.filter(p => p.life > 0 && p.y > -40 && p.y < H + 40);
  }

  function orbPos(t, G) {
    const k = seg(t, TL.orb0, TL.orbHit);
    return { x: lerp(G.tip.x, G.chest.x, k), y: lerp(G.tip.y, G.chest.y, k) - Math.sin(k * Math.PI) * 10 };
  }
  function shieldCenter() { return { x: WX + 16, y: WY + 32 }; }
  function fireballPos(t, G) {
    const c = shieldCenter();
    const dx = G.mouth.x - c.x, dy = G.mouth.y - c.y, d = Math.hypot(dx, dy);
    const end = { x: c.x + dx / d * 36, y: c.y + dy / d * 36 };
    const k = easeOut(seg(t, TL.fb0, TL.fbHit));
    return { x: lerp(G.mouth.x, end.x, k), y: lerp(G.mouth.y, end.y, k) - Math.sin(k * Math.PI) * 14 };
  }
  function shockX(t, G) { return lerp(G.bot.x, CRACK + 30, easeOut(seg(t, TL.slam, TL.crack))); }

  // ---------- Dibujo ----------
  const RAMP = {
    fire: ['#fff6c2', '#ffd84a', '#ff9a1f', '#f05a0f', '#a8200a', '#3a0e08'],
    magic: ['#ffffff', '#d8f0ff', '#9fd4ff', '#5a9cff', '#2a4fb0'],
    spark: ['#ffffff', '#fff2a0', '#ffb13d', '#ff6a1a'],
    ember: ['#ffcf6a', '#ff8a2a', '#b83a10'],
    dust: ['#9a93a0', '#77717e', '#524d58'],
  };
  const pColor = p => {
    const r = RAMP[p.kind], k = 1 - p.life / p.max;
    return r[Math.min(r.length - 1, Math.floor(k * r.length))];
  };

  function drawParticles(filter, additive) {
    ctx.save();
    if (additive) ctx.globalCompositeOperation = 'lighter';
    for (const p of S.p) {
      if (!filter(p)) continue;
      ctx.globalAlpha = p.kind === 'dust' ? clamp(p.life / p.max, 0, 1) * .8 : 1;
      ctx.fillStyle = pColor(p);
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
    ctx.restore();
  }

  function drawBalrog(t, G) {
    if (G.by > H + 10) return;
    const flap = t >= TL.fall ? Math.sin(T * 14) * 4 : Math.sin(T * (2.4 + G.hover * 8)) * (2 + G.hover * 3);
    const ox = G.bx, oy = G.by;
    const override = S.hit > 0 && Math.floor(T * 30) % 2 === 0 ? '#fff2e0' : null;

    glow(G.chest.x, G.chest.y - 10, 110, '255,90,20', .32);

    // Alas
    const wingL = [[14, 10], [10, 2], [4, -8 + flap], [-4, -10 + flap * 1.3], [0, -3 + flap * .6], [-6, 3 + flap * .4], [2, 5], [4, 9]];
    const wingR = [[22, 12], [26, 6], [34, -4 + flap], [44, -7 + flap * 1.3], [40, 3 + flap * .6], [47, 11 + flap * .4], [38, 13], [30, 18]];
    const membrane = (a, b) => (x, y) => override || ((x + y) % 5 === 0 ? b : a);
    fillPolyU(wingL, ox, oy, 3, membrane('#170a08', '#24110c'));
    fillPolyU(wingR, ox, oy, 3, membrane('#1c0c09', '#2c140e'));
    for (const [x, y] of [wingL[2], wingL[3], wingL[5]]) lineU(ox, oy, 3, 14, 10, x, y, override || '#3d1d14');
    for (const [x, y] of [wingR[2], wingR[3], wingR[5]]) lineU(ox, oy, 3, 22, 12, x, y, override || '#44211a');

    drawSprite(BAL, BPAL, ox, oy, 3, override);

    const roaring = (t >= TL.land && t < TL.roar1) || (t >= TL.fb0 - .3 && t < TL.fb0 + .1);
    glow(G.mouth.x, G.mouth.y, 14 + (roaring ? 10 : 0), '255,120,30', .35 + (roaring ? .5 : 0));
  }

  function drawWhip(t, G, Wz) {
    const wp = whipPoints(t, G, Wz);
    for (let i = 0; i < wp.length - 1; i++) {
      line(wp[i].x, wp[i].y, wp[i + 1].x, wp[i + 1].y, 2, i % 2 ? '#ff8a1a' : '#ffd84a');
    }
    const tip = wp[wp.length - 1];
    if (tip.y < H + 10) glow(tip.x, tip.y, 10, '255,160,40', .5);
  }

  function drawBridge(t, G) {
    if (!S.chunks) {
      ctx.drawImage(bridgeCv, 0, FLOOR);
      if (S.cracked) {
        let x = CRACK;
        for (let y = 0; y < BRIDGE_H; y++) {
          x += Math.round(Math.sin(y * 2.3) * 1.5);
          ctx.fillStyle = '#0b0708';
          ctx.fillRect(x, FLOOR + y, 2, 1);
        }
      }
    } else {
      ctx.drawImage(bridgeCv, 0, 0, CRACK, BRIDGE_H, 0, FLOOR, CRACK, BRIDGE_H);
      ctx.fillStyle = '#2a2530';
      for (let y = 0; y < BRIDGE_H; y += 2) ctx.fillRect(CRACK - 1 - (y % 4 ? 1 : 0), FLOOR + y, 2, 2);
      for (const c of S.chunks) {
        ctx.drawImage(bridgeCv, c.x, 0, c.w, BRIDGE_H, Math.round(c.x + c.dx), Math.round(FLOOR + c.y), c.w, BRIDGE_H);
      }
    }

    // Onda expansiva sobre el puente
    if (t >= TL.slam && t < TL.crack + .1) {
      const k = seg(t, TL.slam, TL.crack + .1);
      const fx = shockX(t, G);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 1 - k * .6;
      ctx.fillStyle = '#6ab8ff';
      ctx.fillRect(Math.round(G.bot.x), FLOOR, Math.round(fx - G.bot.x), 1);
      for (let dx = -8; dx <= 8; dx++) {
        const h = Math.round((1 - Math.abs(dx) / 8) * 6);
        for (let y = 0; y < h; y++) {
          ctx.fillStyle = y === h - 1 ? '#ffffff' : '#9fd4ff';
          ctx.fillRect(Math.round(fx + dx), FLOOR - 1 - y, 1, 1);
        }
      }
      ctx.restore();
    }
  }

  function drawStaffTip(x, y, ch) {
    ctx.fillStyle = '#dff4ff';
    ctx.fillRect(Math.round(x) - 2, Math.round(y) - 2, 4, 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 2, 2);
    glow(x, y, 8 + ch * 26, '170,215,255', .35 + ch * .5);
  }

  function drawWizard(t, G, Wz) {
    if (Wz.mode === 'stand') {
      drawSprite(WIZ, WPAL, WX, WY, 2);
      const u = p => [(p.x - WX) / 2, (p.y - WY) / 2];
      const [tx, ty] = u(G.tip), [bx, byy] = u(G.bot), [hx, hy] = u(G.hand);
      lineU(WX, WY, 2, bx, byy, tx, ty, '#6b4526');
      lineU(WX, WY, 2, 10, 15, hx, hy, '#8d939b');
      ctx.fillStyle = WPAL.S;
      ctx.fillRect(Math.round(G.hand.x) - 2, Math.round(G.hand.y) - 2, 4, 4);
      drawStaffTip(G.tip.x, G.tip.y, charge(t));
      return;
    }

    // El bastón cae y queda tirado sobre el puente
    const sb = { x: WX + 28, y: FLOOR - 1 };
    const sa = lerp(-Math.PI / 2, 0, Math.pow(seg(t, TL.grab, TL.grab + .35), 2));
    const st = { x: sb.x + Math.cos(sa) * 50, y: sb.y + Math.sin(sa) * 50 };
    line(sb.x, sb.y, st.x, st.y, 2, '#6b4526');
    drawStaffTip(st.x, st.y, .15 * (1 - seg(t, TL.grab, TL.letgo)));

    // El sombrero sale volando hacia atrás y cae sobre el puente
    const hk = t - TL.grab;
    const hatX = Math.max(WX - 44, WX - 70 * hk);
    const hatY = Math.min(FLOOR - 18, WY - 90 * hk + 200 * hk * hk);
    ctx.drawImage(hatCv, Math.round(hatX), Math.round(hatY));

    if (Wz.mode === 'drag') {
      ctx.save();
      ctx.translate(Math.round(Wz.px), FLOOR);
      ctx.rotate(Wz.ang);
      ctx.drawImage(wizNoHatCv, 0, -46);
      ctx.restore();
      return;
    }

    const x = Wz.sx, y = Math.round(Wz.sy);
    if (y > H) return;
    ctx.drawImage(wizNoHatCv, x, y);
    if (Wz.mode === 'hang') {
      // brazos agarrados al borde
      line(x + 8, y + 14, x + 8, FLOOR, 2, '#8d939b');
      line(x + 22, y + 14, x + 22, FLOOR, 2, '#8d939b');
      ctx.fillStyle = WPAL.S;
      ctx.fillRect(x + 6, FLOOR - 2, 4, 4);
      ctx.fillRect(x + 20, FLOOR - 2, 4, 4);
    } else {
      line(x + 8, y + 14, x + 2, y - 4, 2, '#8d939b');
      line(x + 22, y + 14, x + 28, y - 4, 2, '#8d939b');
    }
  }

  function drawShield(t) {
    let a = 0;
    if (t >= TL.shield0 && t < TL.shield1 + .2) a = Math.min(seg(t, TL.shield0, TL.shield0 + .4), 1 - seg(t, TL.shield1 - .2, TL.shield1 + .2));
    if (a <= 0) return;
    const c = shieldCenter();
    const R = 36 + Math.round(Math.sin(T * 10));
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, FLOOR); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * (.1 + S.shieldFlash * .35);
    ctx.fillStyle = '#4a9cff';
    ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = a;
    const n = Math.round(Math.PI * R);
    for (let i = 0; i < n; i++) {
      const ang = i / n * Math.PI * 2;
      const k = (i + Math.floor(T * 30)) % 6;
      ctx.fillStyle = k < 2 || S.shieldFlash > .5 ? '#ffffff' : k < 4 ? '#9fd4ff' : '#4a8cff';
      ctx.fillRect(Math.round((c.x + Math.cos(ang) * R) / 2) * 2, Math.round((c.y + Math.sin(ang) * R) / 2) * 2, 2, 2);
    }
    ctx.restore();
  }

  function drawProjectiles(t, G) {
    if (t >= TL.orb0 && t < TL.orbHit) {
      const o = orbPos(t, G);
      glow(o.x, o.y, 22, '160,210,255', .7);
      pcircle(o.x, o.y, 4, d => (d < .45 ? '#ffffff' : d < .8 ? '#bfe6ff' : '#5a9cff'));
    }
    if (t >= TL.fb0 && t < TL.fbHit) {
      const f = fireballPos(t, G);
      glow(f.x, f.y, 26, '255,120,30', .7);
      pcircle(f.x, f.y, 5, d => (d < .4 ? '#fff6c2' : d < .7 ? '#ffd84a' : '#ff7a1a'));
    }
    if (S.bolt) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const draw = (pts, s, c) => { for (let i = 0; i < pts.length - 1; i++) line(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, s, c); };
      draw(S.bolt.pts, 3, 'rgba(90,150,255,.55)');
      draw(S.bolt.branch, 2, 'rgba(90,150,255,.45)');
      draw(S.bolt.pts, 1, '#ffffff');
      draw(S.bolt.branch, 1, '#d8f0ff');
      ctx.restore();
      glow(G.chest.x, G.chest.y, 30, '200,230,255', .6);
    }
  }

  const CAPTIONS = [
    [0.8, 3.3, 'Del abismo surge el Balrog...'],
    [4.7, 6.4, 'El mago alza su bastón'],
    [6.6, 7.8, 'El Balrog responde'],
    [7.8, 9.9, '¡Escudo de luz!'],
    [10.6, 12.1, '¡Relámpago!'],
    [14.7, 15.8, '¡El látigo atrapa al mago!'],
    [16.0, 17.5, '«¡Huyan, insensatos!»'],
    [17.8, 19.2, 'El mago cae al abismo...'],
  ];
  const PIX_FONT = '"Press Start 2P", monospace';

  function outlinedText(str, x, y, size, color) {
    ctx.font = `${size}px ${PIX_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#000';
    const o = size >= 16 ? 2 : 1;
    for (const [dx, dy] of [[-o, 0], [o, 0], [0, -o], [0, o], [o, o]]) ctx.fillText(str, x + dx, y + dy);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawOverlay(t) {
    ctx.drawImage(vigCv, 0, 0);
    if (S.flash > 0) {
      ctx.fillStyle = `rgba(${S.flashRGB},${S.flash})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.save();
    for (const [a, b, s] of CAPTIONS) {
      if (t < a || t >= b) continue;
      ctx.globalAlpha = Math.min(seg(t, a, a + .25), 1 - seg(t, b - .25, b));
      // cuando el mago cuelga del borde, el texto va arriba para no taparlo
      outlinedText(s, W / 2, a >= TL.edge ? 14 : H - 16, 8, '#ece8f4');
    }
    if (t >= TL.slam && t < 14.6) {
      ctx.globalAlpha = Math.min(1, seg(t, TL.slam, TL.slam + .15)) * (1 - seg(t, 14.3, 14.6));
      const j = t < TL.slam + .45 ? Math.round(rr(-1, 1)) : 0;
      outlinedText('¡NO PASARÁS!', W / 2 + j, 20 + j, 16, '#fff3c4');
    }
    ctx.restore();
    const fade = t < .6 ? 1 - seg(t, 0, .6) : seg(t, TL.fade0, LOOP);
    if (fade > 0) {
      ctx.fillStyle = `rgba(0,0,0,${fade})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function draw(t) {
    const G = geom(t);
    const Wz = wizState(t);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    const sx = S.shake ? Math.round(rr(-S.shake, S.shake)) : 0;
    const sy = S.shake ? Math.round(rr(-S.shake, S.shake)) : 0;
    ctx.translate(sx, sy);

    ctx.drawImage(bgCv, 0, 0);
    // parpadeo del resplandor del abismo
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(0, FLOOR, 0, H);
    g.addColorStop(0, 'rgba(255,90,20,0)');
    g.addColorStop(1, `rgba(255,90,20,${.12 + .05 * Math.sin(T * 7) + .03 * Math.sin(T * 13)})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.restore();

    drawParticles(p => p.kind === 'ember', true);
    drawBalrog(t, G);
    const whipInFront = t >= TL.whip0;
    if (!whipInFront) drawWhip(t, G, Wz);
    drawBridge(t, G);
    drawWizard(t, G, Wz);
    if (whipInFront) drawWhip(t, G, Wz);
    drawShield(t);
    drawProjectiles(t, G);
    drawParticles(p => p.kind === 'dust', false);
    drawParticles(p => p.kind !== 'dust' && p.kind !== 'ember', true);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawOverlay(t);
  }

  // ---------- Bucle principal y controles ----------
  const progress = document.getElementById('progress');
  const btnPause = document.getElementById('btnPause');
  const btnSlow = document.getElementById('btnSlow');
  let paused = false, speed = 1, elapsed = 0, prevT = 0, last = performance.now();

  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000) * (paused ? 0 : speed);
    last = now;
    elapsed += dt;
    T = elapsed;
    const t = elapsed % LOOP;
    if (t < prevT) reset();
    prevT = t;
    update(t, dt);
    draw(t);
    progress.style.width = (t / LOOP * 100).toFixed(2) + '%';
    requestAnimationFrame(frame);
  }

  function togglePause() {
    paused = !paused;
    btnPause.textContent = paused ? 'Seguir' : 'Pausa';
    btnPause.setAttribute('aria-pressed', String(paused));
  }
  function restart() { elapsed = 0; prevT = 0; reset(); }
  function toggleSlow() {
    speed = speed === 1 ? .5 : 1;
    btnSlow.setAttribute('aria-pressed', String(speed !== 1));
  }

  btnPause.addEventListener('click', togglePause);
  document.getElementById('btnRestart').addEventListener('click', restart);
  btnSlow.addEventListener('click', toggleSlow);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') restart();
    else if (e.key === 's' || e.key === 'S') toggleSlow();
  });

  // Permite abrir en un momento concreto: index.html#t=15
  const m = location.hash.match(/t=([\d.]+)/);
  if (m) elapsed = prevT = Math.min(parseFloat(m[1]), LOOP - .01);

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
